<section id="register-form">
  <a class="return color-turquoise border-turquoise bg-black"><</a>
  <h1>Sign up</h1>
  <form class="register-form" method="POST" action="#">
  <p>
    <label for="name" class="form-label">Full name:</label>
    <input type=text id="name" name="name" placeholder="Full name">
  </p>

    <p>
      <label for="register-email" class="form-label">Email:</label>
      <input type=email id="register-email" name="email" placeholder="Email">
    </p>

    <p>
      <label for="phone-number" class="form-label">Phone number:</label>
      <input type=tel id="phone-number" name="Phone number" placeholder="Phone number" pattern="6[0-9]{2}-[0-9]{3}-[0-9]{3}" required>
    </p>

    <p>
      <label for="birthdate" class="form-label">Birthdate:</label>
      <input type=date id="birthdate" name="birthdate">
    </p>

    <p>
      <label for="password" class="form-label">Password:</label>
      <input type=password id="password" name="password" placeholder="Password">
    </p>

    <p>
      <label for="confirm-password" class="form-label">Confirm password:</label>
      <input type=password id="confirm-password" name="confirm-password" placeholder="Confirm password">
    </p>

    <p>
      <input type=checkbox id="terms-conditions" name="terms-conditions">
    <label for="terms-conditions" class="form-label">I accept terms of service.</label><br>
      <input type=checkbox id="receive-information" name="receive-information">
    <label for="receive-information" class="form-label">Receive information on event updates and related things.</label><br>
      <input type=checkbox id="notifications" name="notifications">
    <label for="notifications" class="form-label">I don't allow notifications and subscribe to the newsletter.</label>

    </p>

    <input class="action border-turquoise color-turquoise bg-black" id="register-submit" type="submit" value="Sign up">

  </form>
</section>
