<section id="login" class="bg-black border-turquoise form-box">
    <div class="form-header">
        <button class="btn-return color-turquoise border-turquoise bg-black" onclick="location.href='../index.html'"><</button>
        <h1 class="color-turquoise form-header font-tektur">Login</h1>
    </div>
    <form id="login_form" method="POST" action="#">
        <p class="form-field">
            <label class="form-label color-turquoise font-sudovar" for="login_email">Email:</label>
            <input class="color-white font-sudovar" id="login_email" type="email" name="email" placeholder="Email">
        </p>
        <p  class="form-field">
            <label class="form-label color-turquoise font-sudovar" for="login_password">Password:</label>
            <input id="login_password" class="color-white font-sudovar" type="password" name="password" placeholder="password">
        </p>
        <input class="btn-submit color-turquoise border-turquoise font-sudovar bg-black" id="login-submit" type="submit" value="Log in">
    </form>
    <p>
        <a class="form-alternative-link color-beige" href="../pages/recovery.html">Forgot password?</a>
        <a class="form-alternative-link color-beige" href="../pages/register.html">Register here</a>
    </p>
</section>
