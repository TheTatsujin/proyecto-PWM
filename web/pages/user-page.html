<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../styles/global.css">

    <title>Account</title>

<body class="bg-black">
<main class="test-container color-turquoise">
    <section id = "user-page" class="bg-black border-turquoise form-box">
        <div class="form-header">
            <button class="btn-return color-turquoise border-turquoise bg-black" onclick="location.href='../index.html'"><</button>
        </div>
        <form id="user-page-form">
            <p class="greeting-header">
                <!-- <img id="user-icon" src="../images/MockupSquare.png" alt="Mockup image"> -->

                <label class="color-white font-sudovar" id="full-name-field" name=""> MOCKUP TEXT</label>
            </p>

                <label class="color-white font-sudovar" id="birthdate-number-field" name=""> MOCKUP TEXT</label>
