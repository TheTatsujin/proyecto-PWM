<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/buttons.css">
    <link rel="stylesheet" href="../styles/forms.css">
    <link rel="stylesheet" href="../styles/tickets-table.css">
    <link rel="stylesheet" href="../styles/banners.css">
    <title>Login</title>
</head>
<body class="bg-black">
    <main class="test-container color-turquoise">
        <section id="login" class="bg-black border-turquoise form-box">
            <div class="form-header">
                <button class="btn-return color-turquoise border-turquoise bg-black" onclick="location.href='../index.html'"><</button>
                <h1 class="color-turquoise form-header font-tektur">Login</h1>
            </div>
            <form id="login_form" method="POST" action="#">
                <p class="form-field">
                    <label class="form-label color-turquoise font-sudovar" for="login_email">Email:</label>
                    <input class="color-white font-sudovar" id="login_email" type="email" name="email" placeholder="email">
                </p>
                <p  class="form-field">
                    <label class="form-label color-turquoise font-sudovar" for="login_password">Password:</label>
                    <input id="login_password" class="color-white font-sudovar" type="password" name="password" placeholder="password">
                </p>
                <input class="btn-submit color-turquoise border-turquoise font-sudovar bg-black" id="login-submit" type="submit" value="Log in">
            </form>
            <p>
                <a class="form-alternative-link color-beige" href="#">Forgot password?</a>
                <a class="form-alternative-link color-beige" href="#">Register here</a>
            </p>
        </section>
    </main>
    <footer>
        <p class="footer_row">
            <span class="color-turquoise footer_main-text">Follow Us</span>
            <span class="color-turquoise footer_main-text">Support</span>
        </p>
        <nav class="footer_row">
            <p>
                <a href="https://x.com/kanyewest?git ">
                    <img class="footer_icon" src="../images/icons/twitter-icon.svg" alt="twitter icon">
                </a>
                <a href="https://www.youtube.com/@joserafaelmoreyt5311/featured">
                    <img class="footer_icon" src="../images/icons/youtube-icon.svg" alt="youtube icon">
                </a>
            </p>
            <span class="color-turquoise">Contact Us</span>
        </nav>
        <nav class="footer_row">
            <p>
                <a href="https://www.tiktok.com/@tiktok_es?lang=es">
                    <img class="footer_icon" src="../images/icons/tiktok-icon.svg" alt="tiktok icon">
                </a>
                <a href="https://www.instagram.com/dylancas16/">
                    <img class="footer_icon" src="../images/icons/instagram-icon.svg" alt="instagram icon">
                </a>
            </p>
            <p>
                <a><img class="footer_icon" src="../images/icons/telephone-icon.svg" alt="telephone icon"></a>
                <a><img class="footer_icon" src="../images/icons/message-icon.svg" alt="message icon"></a>
                <a><img class="footer_icon" src="../images/icons/email-icon.svg" alt="mail icon"></a>
            </p>

    </footer>
</body>
</html>
