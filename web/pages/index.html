<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script type="module" src="../scripts/template-builder.js"></script>
    <link rel="icon" type="image/x-icon" href="../images/icons/favicon.png">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/buttons.css">
    <link rel="stylesheet" href="../styles/index.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWM</title>
</head>
<body class="bg-image">
    <header class="template-container bg-black" template-id="header"></header>
    <main>
        <img id="main-image" src="../images/the-festival2.png" alt="The festival image">
        <section id="main-button-section">
            <button class="btn-main font-sudovar border-violet color-violet bg-black"
                onclick="location.href='tickets.html'">
                Comprar Entradas
            </button>
            <button class="btn-main font-sudovar border-violet color-violet bg-black"
                onclick="location.href='artists.html'">
                Artistas
            </button>
        </section>
        <section id="calendar-section" class="bg-transparent border-turquoise">
            <img src="../images/calendar.png" alt="Event calendar image">
        </section>
        <article id="faq-section">
            <h1 class="color-turquoise font-tektur section-header">FAQ</h1>
            <figure>
                <img class="border-violet" src="../images/monkey-faq.png" alt="Monkey FAQ image">
            </figure>
            <section id="faq-questions" class="template-container" template-id="accordion"></section>
        </article>
    </main>
    <footer class="template-container" template-id="footer"></footer>
</body>
<script>
</script>
</html>
