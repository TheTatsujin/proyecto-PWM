<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="../scripts/xlu-include-file.js"></script>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/buttons.css">
    <link rel="stylesheet" href="../styles/tickets-table.css">
    <title>Line up</title>
</head>
<body class="bg-image">

<header xlu-include-file="../templates/second-header.html" >
</header>
<main>
  <h1 class="font-tektur color-turquoise section-header">
    <label for="dropdown">Tickets</label>
  </h1>
  <select id="dropdown" name="dropdown" class="dropdown-box border-turquoise color-turquoise bg-black">
    <option>Arquitectura</option>
    <option>Telecomuncaciones</option>
  </select>

  <article>
    <table class="border-violet ticket-table bg-transparent">
      <thead>
      <tr class="color-turquoise">
        <th id="ticket-table-left-column">One day Passes</th>
        <th id="ticket-table-center-column">Two Day Passes</th>
        <th id="ticket-table-right-column">Three Day Passes</th>
      </tr>
      </thead>
      <tbody>
      <tr class="color-turquoise">
        <td id="one-day-normal-ticket">Normal Ticket XXX$</td>
        <td id="two-day-normal-ticket">Normal Ticket XXX$</td>
        <td id="three-day-normal-ticket">Normal Ticket XXX$</td>
      </tr>
      <tr class="color-turquoise">
        <td id="one-day-early-ticket">Early Access Ticket XXX$</td>
        <td id="two-day-early-ticket">Early Access Ticket XXX$</td>
        <td id="three-day-early-ticket">Early Access Ticket XXX$</td>
      </tr>
      <tr class="color-turquoise">
        <td id="one-day-vip-ticket">VIP Ticket XXX$</td>
        <td id="two-day-vip-ticket">VIP Ticket XXX$</td>
        <td id="three-day-vip-ticket">VIP Ticket XXX$</td>
      </tr>
      </tbody>
    </table>
  </article>
</main>
<footer xlu-include-file="../templates/footer.html">
</footer>
</body>
<script>
  xLuIncludeFile();
</script>
</html>
