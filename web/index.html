<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles/forms.css">
    <link rel="stylesheet" href="styles/tickets-table.css">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/buttons.css">
    <title>PWM</title>
</head>
<body class="bg-image">
    <header>
        <nav id="header_left-nav">
            <h3 class="color-violet header-text" id="header-faq">Preguntas frecuentes</h3>
            <h3 class="color-violet header-text" id="header-contacts">Calendario</h3>
        </nav>
        <img id="logo" src="images/logo.png" alt="logo de pagina">
        <nav id="header_right-nav">
            <h3 class="color-violet header-text" id="account-section">Iniciar sesion</h3>
        </nav>
    </header>
    <div id="test-content">
        <section id="register" class="bg-black border-turquoise">
            <a class="return color-turquoise border-turquoise bg-black"><</a>
            <h1 class="color-turquoise">Sign up</h1>
            <form id="register-form" method="POST" action="#">
                <p>
                    <label for="name" class="form-label color-turquoise">Full name:</label>
                    <input class="color-white" type=text id="name" name="name" placeholder="Full name">
                </p>

                <p>
                    <label for="register-email" class="form-label color-turquoise">Email:</label>
                    <input class="color-white" type=email id="register-email" name="email" placeholder="Email">
                </p>

                <p>
                    <label for="phone-number" class="form-label color-turquoise">Phone number:</label>
                    <input class="color-white" type=tel id="phone-number" name="Phone number" placeholder="Phone number" pattern="6[0-9]{2}-[0-9]{3}-[0-9]{3}" required>
                </p>

                <p>
                    <label for="birthdate" class="form-label color-turquoise">Birthdate:</label>
                    <input class="color-white" type=date id="birthdate" name="birthdate">
                </p>

                <p>
                    <label for="password" class="form-label color-turquoise">Password:</label>
                    <input class="color-white" type=password id="password" name="password" placeholder="Password">
                </p>

                <p>
                    <label for="confirm-password" class="form-label color-turquoise">Confirm password:</label>
                    <input class="color-white" type=password id="confirm-password" name="confirm-password" placeholder="Confirm password">
                </p>

                <p>
                    <input type=checkbox id="terms-conditions" name="terms-conditions">
                    <label  for="terms-conditions" class="form-label color-white">I accept terms of service.</label>
                </p>

                <p>
                    <input type=checkbox id="receive-information" name="receive-information">
                    <label for="receive-information" class="form-label color-white">Receive information on event updates and related things.</label>
                </p>

                <p>
                    <input type=checkbox id="notifications" name="notifications">
                    <label for="notifications" class="form-label color-white">I don't allow notifications and subscribe to the newsletter.</label>
                </p>

                <input class="action border-turquoise color-turquoise bg-black" id="register-submit" type="submit" value="Sign up">
            </form>
        </section>
    </div>
    <footer>
        <p class="footer_row">
            <span class="color-turquoise footer_main-text">Follow Us</span>
            <span class="color-turquoise footer_main-text">Support</span>
        </p>
        <nav class="footer_row">
            <p>
                <a href="https://x.com/kanyewest?git ">
                    <img class="footer_icon" src="images/icons/twitter-icon.svg" alt="twitter icon">
                </a>
                <a href="https://www.youtube.com/@joserafaelmoreyt5311/featured">
                    <img class="footer_icon" src="images/icons/youtube-icon.svg" alt="youtube icon">
                </a>
            </p>
            <span class="color-turquoise">Contact Us</span>
        </nav>
        <nav class="footer_row">
            <p>
                <a href="https://www.tiktok.com/@tiktok_es?lang=es">
                    <img class="footer_icon" src="images/icons/tiktok-icon.svg" alt="tiktok icon">
                </a>
                <a href="https://www.instagram.com/dylancas16/">
                    <img class="footer_icon" src="images/icons/instagram-icon.svg" alt="instagram icon">
                </a>
            </p>
            <p>
                <a><img class="footer_icon" src="images/icons/telephone-icon.svg" alt="telephone icon"></a>
                <a><img class="footer_icon" src="images/icons/message-icon.svg" alt="message icon"></a>
                <a><img class="footer_icon" src="images/icons/email-icon.svg" alt="mail icon"></a>
            </p>
        </nav>
    </footer>
</body>
    <script src="scripts/main.js"></script>
</html>
