<ion-content [fullscreen]="true">
  <main>
    <img id="main-image" src="https://i.imgur.com/PtJuAA4.png" alt="The festival image">
    <section id="calendar-section" class="bg-transparent border-turquoise">
      <img src="https://i.imgur.com/jZ3eKMq.png" alt="Event calendar image">
    </section>
    <article id="faq-section">
      <h1 class="color-turquoise font-tektur section-header">FAQ</h1>
      <figure>
        <img class="border-violet" src="https://i.imgur.com/8Yt6Iyo.png" alt="Monkey FAQ image">
      </figure>
      <section id="faq-questions" class="template-container">
        @for (faqEntry of retrievedFaq; track faqEntry['id']; let i = $index) {
          <app-accordion [question]="faqEntry['question']" [answer]="faqEntry['answer']"></app-accordion>
        }
      </section>
    </article>
  </main>
</ion-content>
