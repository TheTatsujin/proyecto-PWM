<section class="component">
  <h1 class="color-turquoise font-sudovar center-content">Upload an image</h1>
  <section class="button-section">
    <label id="file-label" class="color-turquoise font-sudovar" for="file">Search</label>
    <input id="file" type="file" class="color-turquoise font-sudovar" (change)="onFileSelected($event)">
  </section>
  <ion-button type="button" size="small" color="tertiary" (click)="onUpload()">Upload</ion-button>
  <p class="color-turquoise font-sudovar" *ngIf="selectedFile">Selected file: {{ selectedFile.name }}</p>
</section>
