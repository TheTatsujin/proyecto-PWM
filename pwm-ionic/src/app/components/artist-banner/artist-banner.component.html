<ion-card id="{{artistName()}}" class="bg-black border-turquoise">
  <figure>
    <img class="artist-image" [attr.src]="artistImage()" alt="Artist Banner">
  </figure>
  <ion-card-header>
    <ion-card-title class="color-turquoise artist-caption"> {{ artistName() }}</ion-card-title>
  </ion-card-header>
  <ion-card-content class="color-white date-caption">
    {{ eventLocation() }}
    {{ eventDate() }}
  </ion-card-content>
</ion-card>

<app-artist-detail
  [artistName]="artistName()"
  [artistImage]="artistImage()"
  ></app-artist-detail>
