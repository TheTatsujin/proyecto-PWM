<ion-tabs>

  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="tickets" href="/tabs/tickets">
      <ion-icon name="ticket-outline"></ion-icon>
      <ion-label>Tickets</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="home" href="/tabs/home">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="lineup" href="/tabs/lineup">
      <ion-icon name="calendar-outline"></ion-icon>
      <ion-label>Line-Up</ion-label>
    </ion-tab-button>

    <!-- tabs.page.html -->
    <ion-tab-button *ngIf="(authenticated$ | async); else loginTab" tab="user-page" href="/tabs/user-page">
      <ion-icon name="calendar-outline"></ion-icon>
      <ion-label>User</ion-label>
    </ion-tab-button>

    <ng-template #loginTab>
      <ion-tab-button tab="login" href="/tabs/login">
        <ion-icon name="calendar-outline"></ion-icon>
        <ion-label>Login</ion-label>
      </ion-tab-button>
    </ng-template>
  </ion-tab-bar>

</ion-tabs>
