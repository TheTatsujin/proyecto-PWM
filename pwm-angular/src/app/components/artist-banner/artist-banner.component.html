<figure class="artist-banner bg-black border-turquoise">
  <img class="artist-image" src="https://material.angular.io/assets/img/examples/shiba2.jpg" alt="Artist Banner">
  <figcaption class="artist-caption color-turquoise bg-black border-turquoise">
    {{ artistName }}
  </figcaption>
  <figcaption class="color-white">
    <h2>DATES</h2>
    <ul>
      <li>{{ eventLocation }}</li>
      <li>{{ eventDate }}</li>
    </ul>
  </figcaption>
</figure>
